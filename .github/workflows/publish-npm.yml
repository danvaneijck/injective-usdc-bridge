name: publish-npm

# Publishes packages/bridge to npm as `injective-usdc-bridge`, with provenance.
#
# Runs only on a pushed tag `bridge-v<version>` (people with write access) or
# a manual dispatch, never on a fork PR. The tag must match the version in
# packages/bridge/package.json.
#
# Auth: npm trusted publishing (OIDC, `id-token: write`) once it is set up for
# this repo and workflow on npmjs.com; until then the NPM_TOKEN secret (an
# automation token from the publishing account). The very first publish of
# the name has to be done by hand from that account, since npm only offers
# trusted publishing for a package that exists. Actions are pinned to commits.

on:
  push:
    tags: ["bridge-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches the package version
        if: github.event_name == 'push'
        run: |
          want="bridge-v$(node -p "require('./packages/bridge/package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME, package says $want"; exit 1; }
      - run: npm ci
      # prepublishOnly typechecks, tests and builds first.
      - run: npm publish --provenance -w packages/bridge
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
