name: publish-service

# Builds the bridge-service image and pushes it to GHCR as
# ghcr.io/<owner>/injective-usdc-bridge-service:{main,sha-<short>}.
# Deploys nothing: the Choice v2 mainnet stack pins a sha tag and is rolled by hand.
#
# Only a push to main (people with write access) or a manual dispatch runs it,
# never a fork PR. Its only credential is the job's own GITHUB_TOKEN, limited
# to writing this repo's package. Actions are pinned to commits, not tags.

on:
  push:
    branches: [main]
    paths:
      - "service/**"
      - "packages/bridge/**"
      - "apps/site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/injective-usdc-bridge-service" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: service/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
