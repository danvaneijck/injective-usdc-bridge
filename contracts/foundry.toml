[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
# Injective EVM's target. Pinned so a newer forge default cannot change the
# bytecode or the gas schedule tests run under.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[rpc_endpoints]
injective_testnet = "https://k8s.testnet.json-rpc.injective.network"
injective_mainnet = "https://sentry.evm-rpc.injective.network"
