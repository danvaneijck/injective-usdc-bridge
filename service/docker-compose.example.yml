services:
  bridge-service:
    build:
      context: ..
      dockerfile: service/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - bridge-data:/data
      # MODE=relay only:
      # - ./secrets/relayer.key:/run/secrets/relayer.key:ro
    restart: unless-stopped

volumes:
  bridge-data:
